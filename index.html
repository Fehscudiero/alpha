    <!-- Critical CSS inline — elimina render-blocking (PageSpeed) -->
    <style>
      :root {
        --brand-primary: #0056a7;
        --brand-dark: #003d7a;
        --brand-mid: #1863dc;
        --accent-cta: #1863dc;
        --accent-cta-h: #0e4db5;
        --text-dark: #1a1a2e;
        --text-body: #3d3d5c;
        --bg-white: #ffffff;
        --trans-fast: 180ms cubic-bezier(0.4, 0, 0.2, 1);
        --trans-med: 320ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
        font-size: 16px;
        -webkit-text-size-adjust: 100%;
      }

      body {
        font-family: "Manrope", "Inter", system-ui, sans-serif;
        background-color: #fff;
        color: #1a1a2e;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      img,
      video {
        display: block;
        max-width: 100%;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button {
        cursor: pointer;
        font-family: inherit;
        border: none;
        background: none;
      }

      h1,
      h2,
      h3,
      h4 {
        font-family: "Montserrat", "Manrope", sans-serif;
        font-weight: 700;
        line-height: 1.15;
        color: #1a1a2e;
        letter-spacing: -0.02em;
      }

      .container {
        width: 100%;
        max-width: 1200px;
        margin-inline: auto;
        padding-inline: 1rem;
      }

      @media (min-width: 640px) {
        .container {
          padding-inline: 1.5rem;
        }
      }

      @media (min-width: 1024px) {
        .container {
          padding-inline: 2rem;
        }
      }

      .nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 200;
        padding-block: 0.875rem;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid transparent;
        transition:
          background var(--trans-med),
          box-shadow var(--trans-med);
      }

      .nav-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .nav-logo {
        display: flex;
        align-items: center;
        gap: 0.625rem;
      }

      .nav-logo img {
        height: 80px;
        width: auto;
        aspect-ratio: 300/90;
        object-fit: contain;
      }

      .nav-mobile-btn {
        display: flex;
        color: #1a1a2e;
        transition: color var(--trans-fast);
        padding: 0.25rem;
      }

      .nav-links-desktop {
        display: none;
        align-items: center;
        gap: 2.5rem;
      }

      @media (min-width: 1024px) {
        .nav-links-desktop {
          display: flex;
        }

        .nav-mobile-btn {
          display: none;
        }
      }

      .skip-link {
        position: absolute;
        top: -100%;
        left: 1rem;
        background: #1863dc;
        color: #fff;
        padding: 0.5rem 1rem;
        border-radius: 0 0 0.5rem 0.5rem;
        font-weight: 700;
        z-index: 9999;
        transition: top 0.2s;
      }

      .skip-link:focus {
        top: 0;
      }

      #root {
        min-height: 100vh;
      }

      #main-content {
        min-height: 100svh;
        display: block;
      }

      .hero {
        min-height: 100svh;
        background: linear-gradient(
          135deg,
          #003d7a 0%,
          #0056a7 50%,
          #1863dc 100%
        );
        display: flex;
        align-items: center;
        padding-top: 9rem;
        contain: layout style;
      }

      .strip-section {
        min-height: 6rem;
        background: #f7f9fc;
        contain: paint;
        overflow: hidden;
      }
    </style>

    <!-- Google tag (gtag.js) — Google Ads + Google Tag -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=AW-18191984976"
    ></script>

    <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
        window.dataLayer.push(arguments);
      }

      window.gtag = window.gtag || gtag;

      gtag("js", new Date());

      /*
        Cross-domain tracking.
        Aplica o linker antes dos configs.
      */

        domains: [
          "alphaconvenios.com.br",
          "alphaconvenios-pkjojy2cc-fehscudieros-projects.vercel.app",
        ],
      });

      /*
        Tag base do Google Ads.
        Isso instala a tag, mas NÃO dispara conversão sozinho.
      */
      gtag("config", "AW-18191984976");

      /*
        Mantendo seu Google Tag / Analytics atual.
      */
      gtag("config", "GT-M6BP6ZPN");
    </script>

    <!--
      Google Ads conversion event — Solicitar cotação

      IMPORTANTE:
      Este script NÃO dispara conversão no carregamento da página.
      Este script NÃO mede clique genérico.
      Este script NÃO tenta entender o formulário.
      Este script NÃO captura nome, telefone, e-mail ou qualquer campo.

      Ele só cria uma função global:
      window.alphaReportQuoteConversion()

      Você deve chamar essa função no React SOMENTE depois que a cotação/lead for enviada com sucesso.
    -->
    <script>
      (function () {
        const CONVERSION_SEND_TO = "AW-18191984976/s5IICIvg970cENDSzuJD";

        let fired = false;

        function sendQuoteConversion() {
          if (fired) return false;

          if (typeof window.gtag !== "function") {
            console.warn(
              "[Google Ads] gtag não encontrado. Conversão não enviada.",
            );
            return false;
          }

          fired = true;

          window.gtag("event", "conversion", {
            send_to: CONVERSION_SEND_TO,
            value: 1.0,
            currency: "BRL",

            /*
              Ajuda se houver redirecionamento logo após o envio.
              Se não houver redirecionamento, não atrapalha.
            */
            event_callback: function () {
              console.info(
                "[Google Ads] Conversão Solicitar cotação confirmada:",
                CONVERSION_SEND_TO,
              );
            },

            event_timeout: 2000,
          });

          console.info(
            "[Google Ads] Conversão Solicitar cotação enviada:",
            CONVERSION_SEND_TO,
          );

          return true;
        }

        /*
          Chamada direta recomendada dentro do React:
          window.alphaReportQuoteConversion?.()
        */
        window.alphaReportQuoteConversion = sendQuoteConversion;

        /*
          Mantive este alias para compatibilidade com o código anterior,
          caso você já tenha implementado window.alphaReportLeadConversion().
        */
        window.alphaReportLeadConversion = sendQuoteConversion;

        /*
          Alternativa desacoplada:
          window.dispatchEvent(new Event("alpha:quote-submit-success"))
        */
        window.addEventListener("alpha:quote-submit-success", function () {
          sendQuoteConversion();
        });

        /*
          Alias do evento anterior, caso você já tenha usado:
          window.dispatchEvent(new Event("alpha:lead-submit-success"))
        */
        window.addEventListener("alpha:lead-submit-success", function () {
          sendQuoteConversion();
        });
      })();
    </script>
